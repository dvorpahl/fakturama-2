stages:
  - package

variables:
  # This will suppress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds. You need to specify `--batch-mode` to make this work.
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true"
  # As of Maven 3.3.0 instead of this you may define these options in `.mvn/maven.config` so the same config is used
  # when running from the command line.
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

# This template uses jdk21 for verifying and deploying images
image: maven:3.9.6-eclipse-temurin-21

# Cache downloaded dependencies and plugins between builds.
# To keep cache across branches add 'key: "$CI_JOB_NAME"'
cache:
  paths:
    - .m2/repository

build:
  stage: package
  script:
    - cd Fakturama-Parent
    - mvn $MAVEN_CLI_OPTS clean install -DskipTests=true
#  artifacts:
#    name: "fakturama_$CI_COMMIT_BRANCH_$CI_JOB_NAME"
#    paths:
#      - '*.jar'
